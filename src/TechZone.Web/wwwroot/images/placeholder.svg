<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="360" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <g transform="translate(140, 110)">
    <!-- TechZone CPU / Chip Icon -->
    <rect x="15" y="15" width="90" height="90" rx="16" fill="url(#primaryGrad)"/>
    <rect x="30" y="30" width="60" height="60" rx="10" fill="#ffffff" opacity="0.15"/>
    <rect x="42" y="42" width="36" height="36" rx="6" fill="#ffffff" opacity="0.3"/>
    <!-- Chip Pins -->
    <line x1="35" y1="5" x2="35" y2="15" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="5" x2="60" y2="15" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="85" y1="5" x2="85" y2="15" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="105" x2="35" y2="115" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="105" x2="60" y2="115" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="85" y1="105" x2="85" y2="115" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="35" x2="15" y2="35" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="60" x2="15" y2="60" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="5" y1="85" x2="15" y2="85" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="35" x2="115" y2="35" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="60" x2="115" y2="60" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="105" y1="85" x2="115" y2="85" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="200" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#0f172a">TECH<tspan fill="#0284c7">ZONE</tspan></text>
  <text x="200" y="300" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#64748b">Hình ảnh sản phẩm đang cập nhật</text>
</svg>
